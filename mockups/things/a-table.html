<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · Table of objects — Things I Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* ---------- The row of objects ----------
   * Objects align on a shared invisible floor line. There is deliberately no
   * drawn shelf: the bookshelf page already owns that metaphor. Only the contact
   * shadows imply a surface. */
  .table-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: center;
    gap: 3rem 1.75rem;
    padding: 1.5rem 0 2.5rem;
  }

  .item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
    /* The item is as wide as its object, so the row's rhythm follows the
     * objects. A long product name wraps under it instead of stretching it. */
    width: calc(var(--h) * var(--r));
    min-width: 6.5rem;
  }

  .item .obj { height: var(--h); width: 100%; }
  .item:hover .obj img { transform: translateY(-6px); }
  .item:hover .obj::after { transform: scale(1.08); opacity: 0.75; }

  .item-label {
    margin-top: 1.6rem;
    text-align: center;
    transition: color 0.2s var(--ease-out);
  }
  .item-name {
    display: block;
    font-size: 0.9375rem;
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: -0.01em;
    color: var(--stone-800);
  }
  .item-type { display: block; font-size: 0.8rem; color: var(--stone-400); margin-top: 0.2rem; }

  /* Selected state: the object stays lifted and a marker appears under it. */
  .item[aria-expanded="true"] .obj img { transform: translateY(-6px); }
  .item[aria-expanded="true"] .item-name { color: var(--stone-900); font-weight: 600; }
  .item[aria-expanded="true"] .item-type { color: var(--stone-600); }
  .item-dot {
    display: block;
    width: 4px; height: 4px;
    border-radius: 999px;
    background: var(--stone-900);
    margin: 0.6rem auto 0;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 0.22s var(--ease-out), transform 0.22s var(--ease-out);
  }
  .item[aria-expanded="true"] .item-dot { opacity: 1; transform: scale(1); }

  /* ---------- The detail panel ----------
   * Opens below the whole row, so the objects are never covered. Height animates
   * with the grid 0fr -> 1fr technique, which needs no JS measurement. */
  .panel-shell {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.42s var(--ease-out);
    border-top: 1px solid transparent;
  }
  .panel-shell[data-open="true"] {
    grid-template-rows: 1fr;
    border-top-color: var(--stone-200);
  }
  .panel-clip { overflow: hidden; }

  .panel {
    display: grid;
    grid-template-columns: 15rem 1fr;
    gap: 3rem;
    align-items: center;
    padding: 2.75rem 0 0.5rem;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.3s var(--ease-out) 0.06s, transform 0.3s var(--ease-out) 0.06s;
  }
  .panel-shell[data-open="true"] .panel { opacity: 1; transform: none; }

  .panel-obj-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 13rem;
  }
  .panel-obj { height: min(13rem, 100%); }
  .panel-obj img { width: auto; }

  .panel-body { max-width: 42ch; }
  .panel-name {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin: 0;
  }
  .panel-meta {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.5rem;
    font-size: 0.85rem;
    color: var(--stone-500);
  }
  .panel-sep { color: var(--stone-300); }
  .panel-why { margin-top: 1.25rem; }

  .hint {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--stone-400);
    margin: 0 0 0.25rem;
    transition: opacity 0.3s var(--ease-out);
  }
  .hint[data-hidden="true"] { opacity: 0; }

  @media (max-width: 880px) {
    .table-row { justify-content: flex-start; gap: 2.5rem 1.75rem; }
    .panel { grid-template-columns: 1fr; gap: 1.75rem; }
    .panel-obj-slot { height: 9rem; justify-content: flex-start; }
  }
  @media (max-width: 560px) {
    .item .obj { height: calc(var(--h) * 0.62); width: calc(var(--h) * 0.62 * var(--r)); }
    .table-row { gap: 2.25rem 1.5rem; }
  }
</style>
</head>
<body>
  <div class="bar">
    <a href="index.html">← all options</a>
    <span class="spacer"></span>
    <strong>A · Table of objects</strong>
    <span>reason opens below the row</span>
  </div>

  <div class="wrap">
    <header class="page-head">
      <p class="page-kicker">Things I Love</p>
      <h1 class="page-title">Things I love</h1>
      <p class="lede">Five things I own and would buy again. No links, no affiliates — just what they are and why they earned the space.</p>
    </header>

    <p class="hint" id="hint">Tap an object</p>
    <div class="table-row" id="row"></div>

    <div class="panel-shell" id="shell" data-open="false">
      <div class="panel-clip">
        <div class="panel" id="panel"></div>
      </div>
    </div>
  </div>

<script src="_data.js"></script>
<script>
  const row = document.getElementById("row");
  const shell = document.getElementById("shell");
  const panel = document.getElementById("panel");
  const hint = document.getElementById("hint");
  let openSlug = null;

  THINGS.forEach((t) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "item focusable";
    b.style.setProperty("--h", t.h + "rem");
    b.style.setProperty("--r", t.ratio);
    b.setAttribute("aria-expanded", "false");
    b.setAttribute("aria-controls", "panel");
    b.dataset.slug = t.slug;
    b.innerHTML = `
      <span class="obj"><img src="${t.img}" alt="${t.name}"></span>
      <span class="item-label">
        <span class="item-name">${t.name}</span>
        <span class="item-type">${t.type}</span>
        <span class="item-dot" aria-hidden="true"></span>
      </span>`;
    b.addEventListener("click", () => select(t.slug));
    row.appendChild(b);
  });

  function select(slug) {
    const closing = openSlug === slug;
    openSlug = closing ? null : slug;

    row.querySelectorAll(".item").forEach((el) =>
      el.setAttribute("aria-expanded", String(el.dataset.slug === openSlug))
    );
    hint.dataset.hidden = String(!!openSlug);

    if (!openSlug) { shell.dataset.open = "false"; return; }

    const t = THINGS.find((x) => x.slug === openSlug);
    panel.innerHTML = `
      <div class="panel-obj-slot">
        <span class="obj panel-obj" style="aspect-ratio:${t.ratio}"><img src="${t.img}" alt=""></span>
      </div>
      <div class="panel-body">
        <h2 class="panel-name">${t.name}</h2>
        <p class="panel-meta"><span>${t.type}</span><span class="panel-sep">·</span><span>${t.owned}</span></p>
        <div class="panel-why">
          ${t.placeholder ? '<span class="placeholder-tag">placeholder copy</span>' : ""}
          <p class="why ${t.placeholder ? "is-placeholder" : ""}">${t.why}</p>
        </div>
      </div>`;
    shell.dataset.open = "true";
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && openSlug) {
      const el = row.querySelector(`[data-slug="${openSlug}"]`);
      select(openSlug);
      el && el.focus();
    }
  });
</script>
</body>
</html>
