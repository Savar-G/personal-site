<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Tile reveal — Things I Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* ---------- Reveal in place ----------
   * The literal brief: click the object, the reason takes its place. The tile
   * keeps its exact size through the swap so the grid never reflows and nothing
   * below the fold jumps. At rest a tile has no frame — just the object on
   * stone. The stone-100 wash only appears on reveal, to hold the text. */

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
    gap: 1.25rem;
    margin-top: 1rem;
  }

  .tile {
    position: relative;
    height: 20rem;
    padding: 1.5rem;
    background: transparent;
    border: 0;
    border-radius: 0.75rem;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    transition: background-color 0.34s var(--ease-out);
  }
  .tile[aria-pressed="true"] { background: var(--stone-100); }

  .face,
  .back {
    position: absolute;
    inset: 1.5rem;
    transition: opacity 0.28s var(--ease-out), transform 0.34s var(--ease-out);
  }

  /* --- Face: the object, its name underneath --- */
  .face {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 1.4rem;
  }
  .face .obj {
    height: var(--h);
    width: calc(var(--h) * var(--r));
    margin-top: auto;
  }
  .face-label { text-align: center; max-width: 13rem; }
  .face-name {
    display: block;
    font-size: 0.9375rem;
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: -0.01em;
    color: var(--stone-800);
  }
  .face-type { display: block; font-size: 0.8rem; color: var(--stone-400); margin-top: 0.2rem; }

  .tile:hover .obj img { transform: translateY(-6px); }
  .tile:hover .obj::after { transform: scale(1.08); opacity: 0.75; }

  .tile[aria-pressed="true"] .face { opacity: 0; transform: scale(0.94); pointer-events: none; }

  /* --- Back: the reason, plus a small thumbnail so you keep the object --- */
  .back {
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: scale(1.03);
    pointer-events: none;
    overflow: hidden;
  }
  .tile[aria-pressed="true"] .back { opacity: 1; transform: none; pointer-events: auto; }

  .back-head {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding-bottom: 0.8rem;
    border-bottom: 1px solid var(--stone-200);
    flex: 0 0 auto;
  }
  .back-thumb {
    width: 2.4rem;
    height: 2.4rem;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .back-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .back-name { display: block; font-size: 0.9375rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; margin: 0; }
  .back-type { display: block; font-size: 0.78rem; color: var(--stone-500); margin: 0; }

  .back-scroll { flex: 1 1 auto; overflow-y: auto; padding-top: 0.85rem; }
  .back-why { font-size: 0.875rem; line-height: 1.6; }
  .back-scroll::-webkit-scrollbar { width: 4px; }
  .back-scroll::-webkit-scrollbar-thumb { background: var(--stone-300); border-radius: 999px; }

  .back-close {
    position: absolute;
    top: -0.55rem;
    right: -0.55rem;
    width: 1.9rem;
    height: 1.9rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 999px;
    background: var(--stone-200);
    color: var(--stone-600);
    font-size: 0.95rem;
    line-height: 1;
    cursor: pointer;
  }
  .back-close:hover { background: var(--stone-300); color: var(--stone-900); }

  .hint {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--stone-400);
    margin: 0 0 0.25rem;
  }

  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .tile { height: 18rem; }
  }
</style>
</head>
<body>
  <div class="bar">
    <a href="index.html">← all options</a>
    <span class="spacer"></span>
    <strong>C · Tile reveal</strong>
    <span>reason replaces the object in place</span>
  </div>

  <div class="wrap">
    <header class="page-head">
      <p class="page-kicker">Things I Love</p>
      <h1 class="page-title">Things I love</h1>
      <p class="lede">Five things I own and would buy again. No links, no affiliates — just what they are and why they earned the space.</p>
    </header>

    <p class="hint">Tap an object to read why</p>
    <div class="grid" id="grid"></div>
  </div>

<script src="_data.js"></script>
<script>
  const grid = document.getElementById("grid");

  THINGS.forEach((t) => {
    // Objects are scaled down here so even the tallest one clears the label.
    const h = Math.min(t.h, 8.5);
    const tile = document.createElement("button");
    tile.type = "button";
    tile.className = "tile focusable";
    tile.setAttribute("aria-pressed", "false");
    tile.innerHTML = `
      <span class="face">
        <span class="obj" style="--h:${h}rem;--r:${t.ratio}"><img src="${t.img}" alt="${t.name}"></span>
        <span class="face-label">
          <span class="face-name">${t.name}</span>
          <span class="face-type">${t.type}</span>
        </span>
      </span>
      <span class="back">
        <span class="back-head">
          <span class="back-thumb"><img src="${t.img}" alt=""></span>
          <span>
            <span class="back-name">${t.name}</span>
            <span class="back-type">${t.type} · ${t.owned}</span>
          </span>
        </span>
        <span class="back-scroll">
          ${t.placeholder ? '<span class="placeholder-tag">placeholder copy</span>' : ""}
          <span class="why back-why ${t.placeholder ? "is-placeholder" : ""}" style="display:block">${t.why}</span>
        </span>
      </span>`;
    tile.addEventListener("click", () => {
      const open = tile.getAttribute("aria-pressed") === "true";
      grid.querySelectorAll(".tile").forEach((el) => el.setAttribute("aria-pressed", "false"));
      tile.setAttribute("aria-pressed", String(!open));
    });
    grid.appendChild(tile);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      grid.querySelectorAll(".tile").forEach((el) => el.setAttribute("aria-pressed", "false"));
    }
  });
</script>
</body>
</html>
