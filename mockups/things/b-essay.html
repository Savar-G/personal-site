<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · Illustrated essay — Things I Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* ---------- Nothing is hidden ----------
   * Every reason is on the page at rest. Objects and text alternate sides so the
   * eye zig-zags down instead of running one column. There is no click target
   * anywhere: with five items, the reason IS the page. */

  .entries { margin-top: 1rem; }

  .entry {
    display: grid;
    grid-template-columns: 20rem 1fr;
    align-items: center;
    gap: 4rem;
    padding: 4.5rem 0;
  }
  .entry + .entry { border-top: 1px solid var(--stone-200); }

  /* Alternate: even entries put the object on the right. */
  .entry:nth-child(even) { grid-template-columns: 1fr 20rem; }
  .entry:nth-child(even) .entry-figure { order: 2; }
  .entry:nth-child(even) .entry-body { order: 1; }

  .entry-figure {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 15rem;
  }
  .entry-figure .obj { height: var(--h); width: calc(var(--h) * var(--r)); }
  .entry-figure .obj img { transition: transform 0.5s var(--ease-out); }
  .entry:hover .obj img { transform: translateY(-4px) scale(1.015); }

  .entry-body { max-width: 46ch; }

  .entry-index {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    color: var(--stone-300);
  }
  .entry-name {
    font-size: 1.625rem;
    font-weight: 600;
    letter-spacing: -0.022em;
    line-height: 1.18;
    margin: 0.5rem 0 0;
  }
  .entry-sub {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    margin: 0.55rem 0 0;
    font-size: 0.875rem;
    color: var(--stone-500);
  }
  .entry-sub .sep { color: var(--stone-300); }
  .entry-why { margin-top: 1.35rem; }

  @media (max-width: 880px) {
    .entry,
    .entry:nth-child(even) { grid-template-columns: 1fr; gap: 2rem; padding: 3.25rem 0; }
    .entry:nth-child(even) .entry-figure { order: 0; }
    .entry:nth-child(even) .entry-body { order: 0; }
    .entry-figure { justify-content: flex-start; min-height: 0; }
    .entry-figure .obj { height: calc(var(--h) * 0.72); width: calc(var(--h) * 0.72 * var(--r)); }
    .entry-name { font-size: 1.375rem; }
  }
</style>
</head>
<body>
  <div class="bar">
    <a href="index.html">← all options</a>
    <span class="spacer"></span>
    <strong>B · Illustrated essay</strong>
    <span>nothing hidden, no click</span>
  </div>

  <div class="wrap">
    <header class="page-head">
      <p class="page-kicker">Things I Love</p>
      <h1 class="page-title">Things I love</h1>
      <p class="lede">Five things I own and would buy again. No links, no affiliates — just what they are and why they earned the space.</p>
    </header>

    <div class="entries" id="entries"></div>
  </div>

<script src="_data.js"></script>
<script>
  const wrapEl = document.getElementById("entries");
  THINGS.forEach((t, i) => {
    const el = document.createElement("article");
    el.className = "entry";
    el.innerHTML = `
      <div class="entry-figure">
        <span class="obj" style="--h:${t.h * 1.5}rem;--r:${t.ratio}">
          <img src="${t.img}" alt="${t.name}">
        </span>
      </div>
      <div class="entry-body">
        <span class="entry-index">${String(i + 1).padStart(2, "0")}</span>
        <h2 class="entry-name">${t.name}</h2>
        <p class="entry-sub"><span>${t.type}</span><span class="sep">·</span><span>${t.owned}</span></p>
        <div class="entry-why">
          ${t.placeholder ? '<span class="placeholder-tag">placeholder copy</span>' : ""}
          <p class="why ${t.placeholder ? "is-placeholder" : ""}">${t.why}</p>
        </div>
      </div>`;
    wrapEl.appendChild(el);
  });
</script>
</body>
</html>
