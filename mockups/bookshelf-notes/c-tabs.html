<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Tabbed Hub — Bookshelf mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* Big segmented tab bar */
  .tabbar { display: inline-flex; gap: 0.2rem; padding: 0.25rem; background: var(--stone-100); border: 1px solid var(--stone-200); border-radius: 0.7rem; margin-bottom: 1.4rem; }
  .tabbar button { font: inherit; font-size: 0.86rem; color: var(--stone-500); background: transparent; border: 0; border-radius: 0.5rem; padding: 0.5rem 0.95rem; cursor: pointer; transition: all 0.16s var(--ease-out); display: inline-flex; align-items: center; gap: 0.4rem; }
  .tabbar button:hover { color: var(--stone-800); }
  .tabbar button[aria-selected="true"] { background: var(--stone-50); color: var(--stone-900); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .tabbar .tn { font-family: var(--font-mono); font-size: 0.7rem; opacity: 0.55; }

  /* Quote wall */
  .wall { column-count: 2; column-gap: 1.5rem; }
  @media (max-width: 680px){ .wall { column-count: 1; } }
  .wq { break-inside: avoid; margin-bottom: 1.5rem; padding: 1.6rem 1.5rem 1.3rem; border: 1px solid var(--stone-200); border-radius: 0.8rem; background: linear-gradient(165deg, color-mix(in oklab, var(--accent) 7%, var(--stone-50)), var(--stone-50)); cursor: pointer; position: relative; transition: transform 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out); }
  .wq:hover { transform: translateY(-3px); box-shadow: 0 16px 30px -20px rgba(12,10,9,0.35); }
  .wq .wq-mark { font-family: Georgia, serif; font-size: 3rem; line-height: 0; color: color-mix(in oklab, var(--accent) 55%, var(--stone-300)); display: block; height: 1rem; }
  .wq p { font-size: 1.18rem; line-height: 1.42; letter-spacing: -0.015em; color: var(--stone-800); margin: 0; font-weight: 400; }
  .wq .wq-src { font-size: 0.78rem; color: var(--stone-400); margin-top: 0.5rem; }
  .wq-foot { display: flex; align-items: center; gap: 0.55rem; margin-top: 1.1rem; padding-top: 0.85rem; border-top: 1px solid color-mix(in oklab, var(--accent) 18%, var(--stone-200)); }
  .wq-foot img { width: 1.4rem; height: 2.05rem; object-fit: cover; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.22); }
  .wq-foot b { font-size: 0.8rem; font-weight: 500; color: var(--stone-700); }
  .wq-foot span { font-size: 0.76rem; color: var(--stone-400); }

  /* Grouped book cards (takeaways / notes) */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.1rem; }
  @media (max-width: 680px){ .grid { grid-template-columns: 1fr; } }
  .bcard { border: 1px solid var(--stone-200); border-radius: 0.8rem; padding: 1.25rem 1.3rem; background: var(--stone-50); cursor: pointer; transition: transform 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out), border-color 0.2s var(--ease-out); }
  .bcard:hover { transform: translateY(-3px); border-color: var(--stone-300); box-shadow: 0 16px 30px -20px rgba(12,10,9,0.3); }
  .bcard-head { display: flex; gap: 0.8rem; align-items: center; margin-bottom: 1rem; }
  .bcard-head img { width: 2.2rem; height: 3.25rem; object-fit: cover; border-radius: 2px; box-shadow: 0 2px 5px -1px rgba(0,0,0,0.3); }
  .bcard-head h3 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
  .bcard-head p { margin: 0.15rem 0 0; font-size: 0.8rem; color: var(--stone-500); }
  .bcard ul { margin: 0; padding: 0; list-style: none; }
  .bcard .tk { position: relative; padding-left: 1.05rem; margin-bottom: 0.6rem; font-size: 0.92rem; line-height: 1.5; color: var(--stone-700); }
  .bcard .tk::before { content:""; position:absolute; left:0; top:0.6em; width:0.36rem; height:0.36rem; border-radius:999px; background: var(--accent); }
  .bcard .nt { margin-bottom: 0.75rem; }
  .bcard .nt b { display:block; font-size: 0.9rem; color: var(--stone-900); margin-bottom: 0.15rem; }
  .bcard .nt span { font-size: 0.88rem; line-height: 1.5; color: var(--stone-600); }
  .bcard .more { font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent); margin-top: 0.4rem; }

  /* All — digest */
  .digest { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.1rem; }
  @media (max-width: 900px){ .digest { grid-template-columns: repeat(2,1fr);} }
  @media (max-width: 600px){ .digest { grid-template-columns: 1fr;} }
  .dcard { border: 1px solid var(--stone-200); border-radius: 0.8rem; overflow: hidden; background: var(--stone-50); cursor: pointer; transition: transform 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out); }
  .dcard:hover { transform: translateY(-3px); box-shadow: 0 16px 30px -20px rgba(12,10,9,0.3); }
  .dcard .dtop { display:flex; gap: 0.8rem; padding: 1.1rem 1.1rem 0.9rem; }
  .dcard .dtop img { width: 2.6rem; height: 3.9rem; object-fit: cover; border-radius: 2px; box-shadow: 0 2px 6px -1px rgba(0,0,0,0.32); }
  .dcard h3 { margin:0; font-size: 0.95rem; font-weight:600; line-height:1.18; letter-spacing:-0.01em; }
  .dcard .dby { margin:0.15rem 0 0; font-size:0.76rem; color:var(--stone-500); }
  .dcard .dsum { padding: 0 1.1rem 0.9rem; font-size: 0.86rem; line-height:1.5; color: var(--stone-600); }
  .dcard .dcounts { display:flex; gap: 0.9rem; padding: 0.7rem 1.1rem; border-top:1px solid var(--stone-200); background: var(--stone-100); }
  .dcard .dcounts span { font-family: var(--font-mono); font-size: 0.72rem; color: var(--stone-500); display:inline-flex; align-items:center; gap:0.3rem; }
  .dcard .dcounts i { width:0.42rem;height:0.42rem;border-radius:999px;background:var(--accent);font-style:normal; }

  .group-label { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone-400); margin: 0 0 1rem; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <p class="page-kicker">Bookshelf · Notes</p>
      <h1 class="page-title">Notes, by kind</h1>
      <p class="page-sub">Switch between your quotes, takeaways, and notes — each shown the way it reads best. Search and topic filters carry across tabs.</p>
    </header>

    <div class="controls">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Search notes, quotes, books…" aria-label="Search notes">
        <button class="search-clear" id="clear" aria-label="Clear search">✕</button>
      </div>
      <div class="chips" id="catChips" role="group" aria-label="Filter by category"></div>
    </div>

    <div class="tabbar" id="tabs" role="tablist"></div>
    <p class="result-meta" id="meta"></p>
    <div id="view"></div>
    <div class="empty" id="empty" hidden><strong>Nothing matches that yet.</strong>Try another word or topic.</div>
  </div>

  <div class="mock-tag"><a href="index.html">← all mockups</a> · C — Tabbed Hub</div>

  <script src="_data.js"></script>
  <script src="_reader.js"></script>
  <script>
    const esc=(s)=>String(s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    function hl(t,q){const e=esc(t);if(!q)return e;const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");return e.replace(re,"<mark class='hit'>$1</mark>");}
    const TABS=[{id:"all",label:"All"},{id:"quote",label:"Quotes"},{id:"takeaway",label:"Takeaways"},{id:"note",label:"Notes"}];
    let state={q:"",cat:"all",tab:"all"};
    const notes=allNotes();

    const tabsEl=document.getElementById("tabs");
    TABS.forEach((t)=>{ const n=t.id==="all"?BOOKS.length:notes.filter((x)=>x.type===t.id).length; const b=document.createElement("button"); b.setAttribute("role","tab"); b.setAttribute("aria-selected",t.id==="all"); b.innerHTML=`${t.label}<span class="tn">${n}</span>`; b.onclick=()=>{state.tab=t.id; tabsEl.querySelectorAll("button").forEach((x)=>x.setAttribute("aria-selected",String(x===b))); render();}; tabsEl.appendChild(b); });

    const catChips=document.getElementById("catChips");
    const catAll=document.createElement("button"); catAll.className="chip"; catAll.setAttribute("aria-pressed","true"); catAll.textContent="All topics"; catAll.onclick=()=>{state.cat="all"; syncCat(catAll); render();}; catChips.appendChild(catAll);
    CATEGORIES.forEach((c)=>{ const b=document.createElement("button"); b.className="chip"; b.setAttribute("aria-pressed","false"); b.textContent=c; b.onclick=()=>{state.cat=c; syncCat(b); render();}; catChips.appendChild(b); });
    function syncCat(a){ catChips.querySelectorAll(".chip").forEach((c)=>c.setAttribute("aria-pressed",String(c===a))); }

    const q=document.getElementById("q"), clear=document.getElementById("clear");
    q.addEventListener("input",()=>{state.q=q.value.trim(); clear.setAttribute("data-show",String(!!state.q)); render();});
    clear.onclick=()=>{q.value="";state.q="";clear.setAttribute("data-show","false");render();q.focus();};

    const inCat=(b)=> state.cat==="all"||b.category===state.cat;
    const qHit=(s)=> !state.q || s.toLowerCase().includes(state.q.toLowerCase());
    const itemHit=(it)=> qHit(it.text+" "+(it.heading||"")+" "+it.book.title+" "+it.book.author);

    function wallView(){
      const list=notes.filter((x)=>x.type==="quote"&&inCat(x.book)&&itemHit(x));
      if(!list.length) return "";
      return `<div class="wall">`+list.map((x)=>`<button class="wq" style="--accent:${x.book.spineColor}" data-slug="${x.book.slug}"><span class="wq-mark" aria-hidden="true">“</span><p>${hl(x.text,state.q)}</p>${x.source?`<div class="wq-src">— ${esc(x.source)}</div>`:""}<div class="wq-foot"><img src="${x.book.cover}" alt=""><div><b>${esc(x.book.title)}</b> <span>· ${esc(x.book.author)}</span></div></div></button>`).join("")+`</div>`;
    }
    function groupView(type){
      const books=BOOKS.filter(inCat);
      const cards=books.map((b)=>{
        const items=(type==="takeaway"?b.takeaways.map((t)=>({text:t})):b.notes.map((n)=>({h:n.h,text:n.p||(n.list?n.list.join(" · "):"")})))
          .filter((it)=> qHit((it.text||"")+" "+(it.h||""))|| qHit(b.title+" "+b.author));
        if(!items.length) return "";
        const body = type==="takeaway"
          ? `<ul>`+items.slice(0,5).map((it)=>`<li class="tk">${hl(it.text,state.q)}</li>`).join("")+`</ul>`
          : items.slice(0,3).map((it)=>`<div class="nt"><b>${hl(it.h||"",state.q)}</b><span>${hl(it.text,state.q)}</span></div>`).join("");
        const more = items.length>(type==="takeaway"?5:3)?`<div class="more">+${items.length-(type==="takeaway"?5:3)} more · open →</div>`:"";
        return `<button class="bcard" style="--accent:${b.spineColor}" data-slug="${b.slug}"><div class="bcard-head"><img src="${b.cover}" alt=""><div><h3>${esc(b.title)}</h3><p>${esc(b.author)}</p></div></div>${body}${more}</button>`;
      }).filter(Boolean);
      return cards.length?`<div class="grid">${cards.join("")}</div>`:"";
    }
    function allView(){
      const books=BOOKS.filter(inCat).filter((b)=> qHit(b.title+" "+b.author+" "+b.summary) || b.takeaways.some(qHit) || b.quotes.some((x)=>qHit(x.text)) || b.notes.some((n)=>qHit((n.p||"")+(n.h||""))));
      if(!books.length) return "";
      return `<div class="digest">`+books.map((b)=>`<button class="dcard" style="--accent:${b.spineColor}" data-slug="${b.slug}"><div class="dtop"><img src="${b.cover}" alt=""><div><h3>${esc(b.title)}</h3><p class="dby">${esc(b.author)}</p></div></div><p class="dsum">${hl(b.summary,state.q)}</p><div class="dcounts"><span><i></i>${b.takeaways.length} takeaways</span><span><i></i>${b.quotes.length} quotes</span><span><i></i>${b.notes.length} notes</span></div></button>`).join("")+`</div>`;
    }

    function render(){
      const view=document.getElementById("view"), empty=document.getElementById("empty"), meta=document.getElementById("meta");
      let html="", count=0;
      if(state.tab==="all"){ html=allView(); count=BOOKS.filter(inCat).length; meta.textContent=""; }
      else if(state.tab==="quote"){ html=wallView(); const n=notes.filter((x)=>x.type==="quote"&&inCat(x.book)&&itemHit(x)).length; meta.textContent=n?`${n} quote${n>1?"s":""}`:""; }
      else { html=groupView(state.tab); meta.textContent=""; }
      view.innerHTML=html;
      empty.hidden=!!html;
      view.querySelectorAll("[data-slug]").forEach((el)=>el.onclick=()=>openReader(el.dataset.slug));
    }
    render();
  </script>
</body>
</html>
