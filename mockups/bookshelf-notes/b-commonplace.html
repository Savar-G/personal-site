<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · Commonplace Book — Bookshelf mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  .cb-wrap { max-width: 70rem; margin: 0 auto; padding: 2.5rem 1.5rem 6rem; }
  .cb-layout { display: grid; grid-template-columns: 14rem 1fr; gap: 3.5rem; align-items: start; }
  @media (max-width: 820px) { .cb-layout { grid-template-columns: 1fr; gap: 1.5rem; } }

  /* Sidebar */
  .cb-side { position: sticky; top: 1.5rem; }
  @media (max-width: 820px) { .cb-side { position: static; } }
  .cb-side .search input { font-size: 0.9rem; padding-top: 0.6rem; padding-bottom: 0.6rem; }
  .cb-side .chips { margin-top: 0.6rem; }
  .cb-index { margin-top: 1.6rem; border-top: 1px solid var(--stone-200); padding-top: 1rem; }
  .cb-index h2 { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone-400); margin: 0 0 0.7rem; }
  .cb-index a { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.84rem; color: var(--stone-500); text-decoration: none; padding: 0.22rem 0; line-height: 1.3; transition: color 0.15s var(--ease-out); }
  .cb-index a:hover { color: var(--stone-900); }
  .cb-index a .ix-n { font-family: var(--font-mono); font-size: 0.7rem; color: var(--stone-300); }

  /* Reading column */
  .cb-read { max-width: 40rem; }
  .cb-book { padding-bottom: 2.75rem; margin-bottom: 2.75rem; border-bottom: 1px solid var(--stone-200); scroll-margin-top: 1.5rem; }
  .cb-book:last-child { border-bottom: 0; }
  .cb-bookhead { display: flex; gap: 1rem; align-items: flex-start; margin-bottom: 1.4rem; }
  .cb-bookhead img { width: 3.1rem; height: 4.6rem; object-fit: cover; border-radius: 2px; box-shadow: 0 2px 6px -1px rgba(0,0,0,0.35); flex: 0 0 auto; }
  .cb-eyebrow { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin: 0.1rem 0 0; }
  .cb-title { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 1.55rem; line-height: 1.15; letter-spacing: -0.01em; margin: 0.25rem 0 0; }
  .cb-by { margin: 0.25rem 0 0; font-size: 0.86rem; color: var(--stone-500); }

  .cb-summary { font-family: "Newsreader", Georgia, serif; font-style: italic; font-size: 1.18rem; line-height: 1.5; color: var(--stone-600); margin: 0 0 1.8rem; }

  .cb-label { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone-400); margin: 1.8rem 0 0.85rem; display: flex; align-items: center; gap: 0.6rem; }
  .cb-label::after { content: ""; flex: 1; height: 1px; background: var(--stone-200); }

  .cb-takeaways { margin: 0; padding: 0; list-style: none; counter-reset: tk; }
  .cb-takeaways li { position: relative; padding-left: 2rem; margin-bottom: 0.85rem; font-size: 1.0rem; line-height: 1.6; color: var(--stone-800); }
  .cb-takeaways li::before { counter-increment: tk; content: counter(tk, decimal-leading-zero); position: absolute; left: 0; top: 0.15rem; font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent); }

  .cb-quote { font-family: "Newsreader", Georgia, serif; font-size: 1.32rem; line-height: 1.42; color: var(--stone-700); text-align: center; max-width: 32rem; margin: 1.4rem auto; }
  .cb-quote .cb-q-mark { display: block; font-size: 2.2rem; color: color-mix(in oklab, var(--accent) 55%, var(--stone-300)); line-height: 0.5; }
  .cb-quote cite { display: block; font-family: var(--font-sans); font-style: normal; font-size: 0.78rem; letter-spacing: 0.02em; color: var(--stone-400); margin-top: 0.9rem; }

  .cb-notes h4 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 1.12rem; margin: 1.4rem 0 0.45rem; color: var(--stone-900); }
  .cb-notes p { font-size: 1.0rem; line-height: 1.68; color: var(--stone-700); margin: 0 0 0.6rem; }
  .cb-notes ul { margin: 0 0 0.6rem; padding-left: 1.2rem; }
  .cb-notes li { font-size: 1.0rem; line-height: 1.6; color: var(--stone-700); margin-bottom: 0.3rem; }

  .cb-faint { color: var(--stone-400); font-size: 0.86rem; font-style: italic; }
</style>
</head>
<body>
  <div class="cb-wrap">
    <header class="page-head">
      <p class="page-kicker">Bookshelf · Notes</p>
      <h1 class="page-title" style="font-family:'Newsreader',Georgia,serif;font-weight:500;">A commonplace book</h1>
      <p class="page-sub">The lines and lessons worth keeping, gathered from every book — typeset to be read, not clicked through.</p>
    </header>

    <div class="cb-layout">
      <aside class="cb-side">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="q" type="search" placeholder="Search…" aria-label="Search notes">
          <button class="search-clear" id="clear" aria-label="Clear search">✕</button>
        </div>
        <div class="chips" id="typeChips" role="group" aria-label="Filter by type"></div>
        <div class="chips" id="catChips" role="group" aria-label="Filter by category"></div>
        <nav class="cb-index" aria-label="Books"><h2>In this volume</h2><div id="index"></div></nav>
      </aside>

      <main class="cb-read" id="read"></main>
    </div>
    <div class="empty" id="empty" hidden><strong>Nothing matches that yet.</strong>Try a different word or clear the filters.</div>
  </div>

  <div class="mock-tag"><a href="index.html">← all mockups</a> · B — Commonplace Book</div>

  <script src="_data.js"></script>
  <script>
    const esc = (s) => String(s).replace(/[&<>"]/g, (c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    function hl(text, q){ const e=esc(text); if(!q) return e; const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"); return e.replace(re,"<mark class='hit'>$1</mark>"); }
    const TYPES = [{id:"all",label:"All"},{id:"takeaway",label:"Takeaways"},{id:"quote",label:"Quotes"},{id:"note",label:"Notes"}];
    let state = { q:"", type:"all", cat:"all" };

    const typeChips = document.getElementById("typeChips");
    TYPES.forEach((t)=>{ const b=document.createElement("button"); b.className="chip"; b.setAttribute("aria-pressed", t.id==="all"); b.textContent=t.label; b.onclick=()=>{state.type=t.id; sync(typeChips,b); render();}; typeChips.appendChild(b); });
    const catChips = document.getElementById("catChips");
    const catAll=document.createElement("button"); catAll.className="chip"; catAll.setAttribute("aria-pressed","true"); catAll.textContent="All topics"; catAll.onclick=()=>{state.cat="all"; sync(catChips,catAll); render();}; catChips.appendChild(catAll);
    CATEGORIES.forEach((c)=>{ const b=document.createElement("button"); b.className="chip"; b.setAttribute("aria-pressed","false"); b.textContent=c; b.onclick=()=>{state.cat=c; sync(catChips,b); render();}; catChips.appendChild(b); });
    function sync(g,a){ g.querySelectorAll(".chip").forEach((c)=>c.setAttribute("aria-pressed", String(c===a))); }

    const q=document.getElementById("q"), clear=document.getElementById("clear");
    q.addEventListener("input",()=>{ state.q=q.value.trim(); clear.setAttribute("data-show",String(!!state.q)); render(); });
    clear.onclick=()=>{ q.value=""; state.q=""; clear.setAttribute("data-show","false"); render(); q.focus(); };

    function entryMatchesQ(text){ return !state.q || text.toLowerCase().includes(state.q.toLowerCase()); }

    function bookHTML(b){
      const Q = state.q;
      const showT = state.type==="all"||state.type==="takeaway";
      const showQu = state.type==="all"||state.type==="quote";
      const showN = state.type==="all"||state.type==="note";
      const bookHay = (b.title+" "+b.author+" "+b.summary).toLowerCase();
      const bookTextHit = !Q || bookHay.includes(Q.toLowerCase());

      const takes = showT ? b.takeaways.filter((t)=>bookTextHit||entryMatchesQ(t)) : [];
      const quotes = showQu ? b.quotes.filter((x)=>bookTextHit||entryMatchesQ(x.text)) : [];
      const notes = showN ? b.notes.filter((n)=>bookTextHit||entryMatchesQ((n.p||"")+(n.h||"")+(n.list?n.list.join(" "):""))) : [];

      if (!takes.length && !quotes.length && !notes.length) return "";

      let html = `<article class="cb-book" id="bk-${b.slug}" style="--accent:${b.spineColor}">`;
      html += `<div class="cb-bookhead"><img src="${b.cover}" alt="Cover of ${esc(b.title)}"><div><p class="cb-eyebrow">${esc(b.category)}</p><h2 class="cb-title">${hl(b.title,Q)}</h2><p class="cb-by">${hl(b.author,Q)}${b.date?` · read ${esc(b.date)}`:""}</p></div></div>`;
      if (b.summary && (state.type==="all")) html += `<p class="cb-summary">${hl(b.summary,Q)}</p>`;

      if (takes.length){ html += `<p class="cb-label">Takeaways</p><ol class="cb-takeaways">` + takes.map((t)=>`<li>${hl(t,Q)}</li>`).join("") + `</ol>`; }
      if (quotes.length){ html += `<p class="cb-label">In their words</p>` + quotes.map((x)=>`<blockquote class="cb-quote"><span class="cb-q-mark" aria-hidden="true">“</span>${hl(x.text,Q)}${x.source?`<cite>— ${esc(x.source)}</cite>`:`<cite>— ${esc(b.author)}</cite>`}</blockquote>`).join(""); }
      if (notes.length){ html += `<p class="cb-label">Notes</p><div class="cb-notes">` + notes.map((n)=>{ const body=n.list?`<ul>${n.list.map((li)=>`<li>${hl(li,Q)}</li>`).join("")}</ul>`:`<p>${hl(n.p,Q)}</p>`; return (n.h?`<h4>${hl(n.h,Q)}</h4>`:"")+body; }).join("") + `</div>`; }
      html += `</article>`;
      return html;
    }

    function render(){
      const read=document.getElementById("read"), index=document.getElementById("index"), empty=document.getElementById("empty");
      const books = BOOKS.filter((b)=> state.cat==="all"||b.category===state.cat);
      const chunks = books.map((b)=>({b, html: bookHTML(b)})).filter((x)=>x.html);
      read.innerHTML = chunks.map((x)=>x.html).join("");
      empty.hidden = chunks.length>0;
      index.innerHTML = chunks.map((x)=>`<a href="#bk-${x.b.slug}"><span>${esc(x.b.title)}</span><span class="ix-n">${noteCount(x.b)}</span></a>`).join("") || `<p class="cb-faint">No matches.</p>`;
    }
    render();
  </script>
</body>
</html>
