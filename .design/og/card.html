<!doctype html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Courier+Prime:wght@700&family=Reenie+Beanie&display=block">
<style>
  html, body { margin: 0; }
  .og { width: 1200px; height: 630px; position: relative; overflow: hidden; background: #f4f1ec; font-family: Inter, system-ui, sans-serif; color: #18181B; }
  .pol { position: absolute; background: #fff; padding: 10px 10px 40px; box-shadow: 0 14px 30px rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.1); }
  .pol img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .pol img.obj { object-fit: contain; }
  .pol span { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-family: 'Reenie Beanie', cursive; font-size: 30px; color: #27272A; }
  .label { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-2deg); background: #fff; padding: 34px 54px 30px; box-shadow: 0 20px 50px rgba(0,0,0,.25); text-align: center; }
  .label::before, .label::after { content: ''; position: absolute; top: -18px; width: 120px; height: 36px; background: rgba(255,236,170,.75); }
  .label::before { left: -30px; transform: rotate(-24deg); }
  .label::after { right: -30px; transform: rotate(14deg); }
  h1 { white-space: nowrap; font-size: 84px; font-weight: 600; letter-spacing: -3px; line-height: 1.1; margin: 0; }
  .hl { color: #2F66F0; background: #E3ECFD; border-radius: 18px; padding: 0 14px; margin: 0 -6px; }
  p { font-size: 22px; color: #52525B; margin: 14px 0 0; }
  .url { font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 20px; color: #A1A1AA; margin-top: 14px; }
</style>
</head>
