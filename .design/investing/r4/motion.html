<!doctype html>
<html><head><meta charset="utf-8"><title>/investing - motion options (r4)</title>
<style>
  :root { --ink:#18181B; --body:#52525B; --muted:#A1A1AA; --line:#E4E4E7; --soft:#F4F4F5; --up:#15803D; --down:#B91C1C;
    --c0:#5f97f4;--c1:#00b481;--c2:#4e57b7;--c3:#00b59d;--c4:#674eb0;--c5:#00b3b7;--c6:#7a46a4;--c7:#00afce;--c8:#8a3f93;--c9:#00a8e1;--c10:#97397f;--c11:#30a0ed;--c12:#a13567; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 Inter, var(--font-sans, system-ui), sans-serif; }
  .wrap { background:#fff; color:var(--ink); border-radius:var(--radius,12px); padding:18px; }
  .opts { display:flex; flex-wrap:wrap; gap:8px 16px; margin-bottom:14px; font-size:12.5px; color:var(--body); }
  .opts label { display:flex; gap:6px; align-items:center; cursor:pointer; }
  .opts button { all:unset; cursor:pointer; color:#2F66F0; font-weight:600; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .bar h2 { margin:0; font-size:17px; }
  .seg { display:inline-flex; background:var(--soft); border-radius:10px; padding:3px; }
  .seg button { all:unset; cursor:pointer; font-size:12.5px; font-weight:500; color:var(--body); padding:5px 11px; border-radius:8px; }
  .seg button[aria-pressed="true"] { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
  .acct { display:grid; grid-template-columns:230px 1fr; gap:12px; }
  .card { border:1px solid var(--line); border-radius:16px; padding:16px; }
  .chart { display:flex; flex-direction:column; align-items:center; }
  .chart h3 { align-self:flex-start; margin:0; font-size:14px; }
  .chart h3 span { display:block; color:var(--muted); font-weight:500; font-size:12px; }
  .donut { position:relative; width:196px; height:196px; margin:12px 0 0; }
  .donut svg { width:100%; height:100%; overflow:visible; }
  .donut path { transition:opacity 160ms ease, transform 220ms cubic-bezier(.2,.8,.2,1), filter 220ms ease; cursor:pointer; }
  .donut.hov path:not(.on) { opacity:.28; }
  .scale .donut path.on { transform:scale(1.035); transform-origin:120px 120px; }
  .pop .donut path.on { filter:drop-shadow(0 4px 6px rgba(0,0,0,.18)); }
  .centre { position:absolute; inset:0; display:grid; place-content:center; text-align:center; pointer-events:none; }
  .centre b { font-size:24px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .centre small { font-size:11.5px; color:var(--body); }
  .centre .tk { font-size:11px; font-weight:600; }
  .under { min-height:2.9em; margin:8px 0 0; text-align:center; font-size:12.5px; color:var(--body); }
  .under b { color:var(--ink); }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th { text-align:left; font-weight:500; color:var(--body); font-size:12px; padding:0 8px 8px; border-bottom:1px solid var(--line); }
  th.n, td.n { text-align:right; }
  td { padding:6px 8px; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:0; }
  tbody tr { transition:background 120ms ease; }
  tbody tr.on { background:var(--soft); }
  .h { display:flex; align-items:center; gap:10px; }
  .sw { width:4px; height:18px; border-radius:2px; }
  .up { color:var(--up); } .down { color:var(--down); }
  .rcell { display:flex; align-items:center; justify-content:flex-end; gap:8px; }
  .rbar { position:relative; width:64px; height:6px; display:none; }
  .bars .rbar { display:block; }
  .rbar::before { content:""; position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:var(--line); }
  .rbar i { position:absolute; top:0; height:100%; border-radius:3px; transition:width 420ms cubic-bezier(.2,.8,.2,1), left 420ms cubic-bezier(.2,.8,.2,1); }
  .rbar i.up { background:#15803D55; } .rbar i.down { background:#B91C1C55; }
  .rv { min-width:62px; display:inline-block; }
  @media (max-width:600px) { .acct { grid-template-columns:1fr; } .rbar { width:40px; } }
</style></head>
<body><div class="wrap">
  <div class="opts">
    <label><input type="checkbox" id="o-sweep" checked> 1 · Sweep in + count up</label>
    <label><input type="checkbox" id="o-pop" checked> 2 · Slice slides out on hover</label>
    <label><input type="checkbox" id="o-tween" checked> 3 · Numbers roll on period change</label>
    <label><input type="checkbox" id="o-bars"> 4 · Return bars in the table</label>
    <button id="replay">↻ replay entrance</button>
  </div>
  <div class="bar"><h2>What I hold</h2>
    <div class="seg"><button data-p="1M">1M</button><button data-p="YTD">YTD</button><button data-p="1Y">1Y</button><button data-p="ALL" aria-pressed="true">All time</button></div></div>
  <div class="acct" id="acct">
    <div class="card chart"><h3>TFSA<span>Tax-Free Savings Account</span></h3>
      <div class="donut" id="donut"><svg viewBox="0 0 240 240"><defs><mask id="sweep"><circle id="sw" cx="120" cy="120" r="60" fill="none" stroke="#fff" stroke-width="122" transform="rotate(-90 120 120)"/></mask></defs><g id="ring" mask="url(#sweep)"></g></svg>
        <div class="centre" id="centre"></div></div>
      <p class="under" id="under"></p></div>
    <div class="card"><table><thead><tr><th>Holding</th><th class="n" id="rh">Return, all time</th><th class="n">Allocation</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</div>
<script>
const A = {"name":"TFSA","returns":{"1M":0.0358,"YTD":0.0809,"1Y":0.1089,"ALL":0.3189},"holdings":[{"t":"AMZN","n":"Amazon","w":0.1405,"r":{"1M":0.0021,"YTD":0.1008,"1Y":0.1742,"ALL":0.2987}},{"t":"GOOGL","n":"Alphabet","w":0.1324,"r":{"1M":-0.005,"YTD":0.1128,"1Y":0.42,"ALL":0.8536}},{"t":"META","n":"Meta","w":0.1317,"r":{"1M":0.109,"YTD":0.1202,"1Y":0.0443,"ALL":0.2397}},{"t":"MELI","n":"MercadoLibre","w":0.1017,"r":{"1M":-0.0322,"YTD":-0.087,"1Y":-0.1477,"ALL":-0.0701}},{"t":"BN","n":"Brookfield","w":0.0876,"r":{"1M":-0.0222,"YTD":-0.1845,"1Y":-0.1913,"ALL":0.2519}},{"t":"MSFT","n":"Microsoft","w":0.0827,"r":{"1M":0.056,"YTD":0.1105,"1Y":0.0477,"ALL":0.3617}},{"t":"ASML","n":"ASML","w":0.0594,"r":{"1M":0.0475,"YTD":0.5497,"1Y":0.6893,"ALL":0.9797}},{"t":"MU","n":"Micron","w":0.0557,"r":{"1M":-0.0107,"YTD":2.2047,"1Y":3.8916,"ALL":1.4073}},{"t":"TVK","n":"Terravest","w":0.0551,"r":{"1M":-0.0331,"YTD":-0.3198,"1Y":-0.1849,"ALL":-0.0949}},{"t":"SPGI","n":"S&P Global","w":0.0494,"r":{"1M":-0.0238,"YTD":-0.1679,"1Y":-0.1048,"ALL":-0.1277}},{"t":"MA","n":"Mastercard","w":0.0465,"r":{"1M":0.0518,"YTD":0.0635,"1Y":0.069,"ALL":0.2605}},{"t":"V","n":"Visa","w":0.0463,"r":{"1M":0.043,"YTD":0.1228,"1Y":0.1326,"ALL":0.355}},{"t":"ISRG","n":"Intuitive Surgical","w":0.0109,"r":{"1M":0.1119,"YTD":0.1185,"1Y":0.1185,"ALL":0.1185}}]};
const SPAN = { "1M":"past month", YTD:"this year", "1Y":"past year", ALL:"all time" };
const $ = (id) => document.getElementById(id);
const opt = (k) => $("o-" + k).checked;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let period = "ALL", active = null, shownTotal = A.returns.ALL;
const pct = (x, sign = true) => `${sign ? (x >= 0 ? "+" : "−") : ""}${Math.abs(x * 100).toFixed(1)}%`;
const tone = (x) => (x >= 0 ? "up" : "down");
const ease = (t) => 1 - Math.pow(1 - t, 3);

// Ring: slices in slot order; each knows its mid-angle for the slide-out.
const P = (r, a) => `${120 + r * Math.sin(a)} ${120 - r * Math.cos(a)}`;
let acc = 0;
const slices = A.holdings.map((h, i) => {
  const a0 = acc, a1 = acc + h.w * 2 * Math.PI; acc = a1;
  const s = a0 + .006, e = a1 - .006, l = e - s > Math.PI ? 1 : 0, mid = (a0 + a1) / 2;
  return { h, i, mid, d: `M${P(116, s)}A116 116 0 ${l} 1 ${P(116, e)}L${P(74, e)}A74 74 0 ${l} 0 ${P(74, s)}Z` };
});
$("ring").innerHTML = slices.map((s) => `<path d="${s.d}" fill="var(--c${s.i})" data-t="${s.h.t}"></path>`).join("");
$("rows").innerHTML = A.holdings.map((h, i) => `<tr data-t="${h.t}"><td><div class="h"><span class="sw" style="background:var(--c${i})"></span><b>${h.t}</b><span style="color:var(--body);font-size:12px">${h.n}</span></div></td>
  <td class="n"><div class="rcell"><span class="rbar"><i></i></span><span class="rv"></span></div></td><td class="n">${(h.w * 100).toFixed(1)}%</td></tr>`).join("");

// 3 · numbers roll from the old value to the new one.
const rolls = new Map();
function roll(el, from, to, fmt, ms = 450) {
  cancelAnimationFrame(rolls.get(el));
  if (!opt("tween") || reduce || from === to) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  // A frame's timestamp can be a little earlier than t0; clamp so the count never starts below "from".
  const step = (t) => { const k = Math.min(1, Math.max(0, (t - t0) / ms)); el.textContent = fmt(from + (to - from) * ease(k)); if (k < 1) rolls.set(el, requestAnimationFrame(step)); };
  rolls.set(el, requestAnimationFrame(step));
}
function centre() {
  const h = A.holdings.find((x) => x.t === active);
  if (h) {
    $("centre").innerHTML = `<span class="tk">${h.t}</span><b class="${tone(h.r[period])}">${pct(h.r[period])}</b><small>${SPAN[period]}</small>`;
    $("under").innerHTML = `<b>${h.n}</b><br>${(h.w * 100).toFixed(1)}% of TFSA`;
  } else {
    $("centre").innerHTML = `<b class="${tone(A.returns[period])}" id="tot"></b><small>${SPAN[period]}</small>`;
    $("tot").textContent = pct(shownTotal);
    $("under").innerHTML = "";
  }
}
let prev = period;
function render() {
  document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.p === period));
  $("rh").textContent = "Return, " + SPAN[period];
  const max = Math.max(...A.holdings.map((h) => Math.abs(h.r[period])));
  document.querySelectorAll("#rows tr").forEach((tr, i) => {
    const h = A.holdings[i], x = h.r[period], v = tr.querySelector(".rv"), bar = tr.querySelector(".rbar i");
    v.className = "rv " + tone(x);
    roll(v, h.r[prev], x, (y) => `${y >= 0 ? "▲" : "▼"} ${pct(y, false)}`);
    const w = Math.abs(x) / max * 50;
    bar.className = tone(x); bar.style.width = w + "%"; bar.style.left = x >= 0 ? "50%" : 50 - w + "%";
  });
  const from = shownTotal; shownTotal = A.returns[period]; centre();
  if (!active) { $("tot").className = tone(shownTotal); roll($("tot"), from, shownTotal, (y) => pct(y)); }
  prev = period;
}
// 2 · hover: the slice slides out along its middle; the row lights up.
function hover(t) {
  active = t;
  $("donut").classList.toggle("hov", !!t);
  document.querySelectorAll("[data-t]").forEach((el) => {
    const on = el.dataset.t === t; el.classList.toggle("on", on);
    if (el.tagName === "path") {
      const s = slices.find((x) => x.h.t === el.dataset.t);
      el.style.transform = on && opt("pop") ? `translate(${7 * Math.sin(s.mid)}px, ${-7 * Math.cos(s.mid)}px)` : "";
    }
  });
  centre();
}
document.querySelectorAll("[data-t]").forEach((el) => { el.addEventListener("mouseenter", () => hover(el.dataset.t)); el.addEventListener("mouseleave", () => hover(null)); });
document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => { period = b.dataset.p; render(); }));
$("o-pop").addEventListener("change", () => { document.body.classList.toggle("scale", !opt("pop")); document.body.classList.toggle("pop", opt("pop")); });
$("o-bars").addEventListener("change", () => $("acct").classList.toggle("bars", opt("bars")));
document.body.classList.add("pop");

// 1 · entrance: the ring sweeps in clockwise (a growing mask), the total counts up from 0.
function entrance() {
  const c = 2 * Math.PI * 60, sw = $("sw");
  sw.setAttribute("stroke-dasharray", `${c} ${c}`);
  if (!opt("sweep") || reduce) { sw.setAttribute("stroke-dashoffset", 0); shownTotal = A.returns[period]; centre(); return; }
  sw.animate([{ strokeDashoffset: c }, { strokeDashoffset: 0 }], { duration: 900, easing: "cubic-bezier(.45,0,.2,1)", fill: "forwards" });
  shownTotal = 0; centre();
  const from = 0; shownTotal = A.returns[period];
  setTimeout(() => roll($("tot"), from, shownTotal, (y) => pct(y), 900), 120);
  document.querySelectorAll("#rows tr").forEach((tr, i) => tr.animate([{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "none" }], { duration: 300, delay: 60 + i * 35, easing: "ease-out", fill: "backwards" }));
}
$("replay").addEventListener("click", entrance);
render(); entrance();
</script>
</body></html>
